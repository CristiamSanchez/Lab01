<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hamburger Rapid &bull; App Móvil</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/app/manifest.json" />
  <meta name="theme-color" content="#0c0c0e" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hamburger Rapid" />
  <link rel="apple-touch-icon" href="/app/icon-192.svg" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/app/sw.js')
          .then((reg) => console.log('✅ [PWA] Service Worker registrado:', reg.scope))
          .catch((err) => console.error('❌ [PWA] Error en Service Worker:', err));
      });
    }
  </script>
</body>
</html>
